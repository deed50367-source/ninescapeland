# Auto-deploy to Hostinger on push to main
name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Serialize uploads; GitHub keeps only the latest pending release in this group.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Covers a full six-language prerender plus a first full FTPS upload and acceptance.
    timeout-minutes: 75
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Chrome for prerendering
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build and Prerender static HTML
        run: |
          set -o pipefail
          npm run build:static 2>&1 | tee prerender.log
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PRERENDER_CONCURRENCY: '6'
          # Backend endpoint is configurable so the self-hosted VPS backend can be
          # switched in without a code change. Falls back to the current hosted
          # backend when the repo secrets are not set yet.
          # These are PUBLISHABLE keys (safe to expose in client-side code)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gianldlquknsdhfpqqfe.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpYW5sZGxxdWtuc2RoZnBxcWZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxODU5MzgsImV4cCI6MjA4Mzc2MTkzOH0.yEFhGkbyfDFqJNcKsS4QBo1ZSPV8MN9oAHpih3yOhak' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'gianldlquknsdhfpqqfe' }}

      - name: Stage external media and prepare release acceptance
        run: |
          python3 scripts/production_acceptance.py media
          python3 scripts/production_acceptance.py manifest --revision "$GITHUB_SHA"

      - name: Deploy to Hostinger via FTPS (port 21)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          protocol: ftps
          port: 21
          timeout: 300000
          dangerous-clean-slate: false
          # Bump this name to force a full re-upload (the old state file made the
          # action skip HTML whose size was unchanged, leaving stale pages online).
          state-name: .ftp-deploy-sync-state-geo.json
          log-level: verbose

      - name: Verify formal-domain release and all captured pages
        run: python3 scripts/production_acceptance.py verify

      - name: Verify production browser and equipment playback
        run: node scripts/production_browser.mjs
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Retain generation logs and production acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-acceptance-${{ github.sha }}
          path: |
            prerender.log
            deployment-manifest.json
            production-acceptance.json
            production-browser.json
            production-screenshots/
          if-no-files-found: warn
          retention-days: 14
