# /etc/nginx/sites-available/api.indoorplaygroundsolution.com
# 反代自建 Supabase（Kong 网关 127.0.0.1:8000）
server {
  listen 80;
  server_name api.indoorplaygroundsolution.com;

  # 素材库上传大图必需（前端上限 50MB）
  client_max_body_size 50m;
  client_body_timeout 120s;

  # 图片/接口响应压缩
  gzip on;
  gzip_types application/json application/javascript text/plain text/css image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime / 在线客服 WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Studio 后台只允许自己的 IP 访问（把 x.x.x.x 换成你的公网 IP）
  location /project {
    # allow x.x.x.x;
    # deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
  }
}

# 证书：certbot --nginx -d api.indoorplaygroundsolution.com
